name: 'build-lint'
on: # rebuild any PRs and main branch changes
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build: # make sure build/ci work properly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: |
          npm ci
      - run: |
          npm run build
      - run: |
          npm run build-lint

  licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DASH_VERSION: 1.1.0
      DASH_SHA256: ba4e84e1981f0e51f92a42ec8fc8b9668dabb08d1279afde46b8414e11752b06
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache the Eclipse Dash license tool
        id: dash-cache
        uses: actions/cache@v4
        with:
          path: dash-licenses.jar
          key: dash-licenses-${{ env.DASH_VERSION }}
      - name: Download the Eclipse Dash license tool
        if: steps.dash-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o dash-licenses.jar \
            https://clementd-files.cellar-c2.services.clever-cloud.com/org.eclipse.dash.licenses-$DASH_VERSION.jar
      - name: Verify the Eclipse Dash license tool
        run: echo "$DASH_SHA256  dash-licenses.jar" | sha256sum -c
      - name: Check npm package dependency licenses
        # the tool exits with the number of dependencies that are not approved
        run: java -jar dash-licenses.jar -summary DEPENDENCIES-npm package-lock.json
      - name: Check wasm crate dependency licenses
        if: ${{ !cancelled() }}
        working-directory: wasm
        shell: bash
        run: |
          cargo tree -e normal --prefix none --no-dedupe \
            | sort -u \
            | grep -v '^[[:space:]]*$' \
            | grep -v biscuit \
            | sed -E 's|([^ ]+) v([^ ]+).*|crate/cratesio/-/\1/\2|' \
            | java -jar ../dash-licenses.jar -summary ../DEPENDENCIES-crate -
      - name: Upload the license summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-licenses
          path: DEPENDENCIES-*
